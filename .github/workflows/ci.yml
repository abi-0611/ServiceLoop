name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs entirely in DEMO_MODE against the sandbox adapters (master §5).
  DEMO_MODE: 'true'
  NODE_ENV: test
  CI: 'true'

jobs:
  static:
    name: lint · typecheck · unit tests · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Domain coverage gate (>= 80%)
        run: pnpm --filter @serviceloop/domain run test:coverage

      - name: Conversation simulator (scripted personas)
        # No database, no queue, no model: the persona suite is a pure CI
        # fixture, so it belongs in the fast job and gates every push.
        run: pnpm sim

      - name: Voice simulator (scripted calls)
        # Whole telephone calls, and the same rule applies: no database, no
        # telco, no model — a loopback line and fixture audio through the real
        # streaming speech port. A voice flow checked only by a person listening
        # to a demo regresses the first week nobody listens.
        run: pnpm sim:voice

      - name: Build
        run: pnpm build

      # The three phase-7 gates that need the build to have happened. Each
      # reads what will ship rather than the source: a lint against the source
      # can pass while the artefact it produced is wrong.
      - name: Template lint
        # Catches, before merge, the three failures that otherwise surface in
        # front of a customer: a Tamil variant taking different variables from
        # its English original, a customer-facing template that exists only in
        # English, and a name Meta would reject on submission.
        run: pnpm lint:templates

      - name: Migration policy (expand-migrate-contract)
        # A destructive migration with no CONTRACT waiver fails here. Cloud Run
        # serves two revisions at once during a deploy, so a dropped column is
        # an outage — and a rollback after one has nothing to roll back to.
        run: pnpm lint:migrations

  security:
    name: secrets · dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0` so gitleaks scans the *history*, not just the tip. A
      # secret committed and then removed in the next commit is still a leaked
      # secret — it is in the clone every contributor already has — and a
      # shallow scan would report the repository clean.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit (pnpm)
        # High and above only. `--audit-level moderate` on a monorepo of this
        # size fails every week on a transitive dev dependency, and a gate that
        # fails every week is a gate people learn to re-run until it passes.
        run: pnpm audit --audit-level high --prod

      - name: Dependency scan (osv-scanner)
        # A second opinion from a different vulnerability database. The overlap
        # with `pnpm audit` is large and the gaps do not coincide, which is the
        # whole reason for running both.
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  integration:
    name: integration · demos · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # `pnpm db:migrate` and `pnpm db:seed` call the db package directly
        # rather than through turbo, so nothing builds their @serviceloop/*
        # dependencies for them; those resolve to `dist/`, which must exist first.
        run: pnpm build

      - name: Start the dev stack
        # `up --wait` fails as soon as any container exits, even with status 0,
        # so the long-running services are waited on here and the one-shot bucket
        # bootstrap is run separately, where its exit code is the useful signal.
        run: |
          docker compose --project-directory . -f infra/compose.yaml up -d --wait postgres redis minio
          docker compose --project-directory . -f infra/compose.yaml run --rm minio-bootstrap

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      # Integration suites reuse the compose stack rather than starting their
      # own Testcontainers; the container path is exercised locally.
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://serviceloop:serviceloop@localhost:5432/serviceloop_test
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          docker compose --project-directory . -f infra/compose.yaml exec -T postgres \
            psql -U serviceloop -d postgres -c "CREATE DATABASE serviceloop_test"
          pnpm --filter @serviceloop/db run test:integration
          pnpm --filter @serviceloop/workers run test:integration
          pnpm --filter @serviceloop/api run test:integration

      - name: Phase 1 demo
        run: pnpm demo:phase1

      - name: Phase 2 demo
        run: pnpm demo:phase2

      - name: Phase 3 demo
        run: pnpm demo:phase3

      - name: Phase 4 demo
        run: pnpm demo:phase4

      - name: Phase 5 demo
        run: pnpm demo:phase5

      - name: Phase 6 demo
        run: pnpm demo:phase6

      - name: Phase 7 demo
        # The DPDP export and erasure, the WhatsApp-outage drill and the cost
        # split — with the four probes made in raw SQL. The erasure assertions
        # are the reason this runs here rather than nightly: a change that
        # quietly stopped destroying a customer's data would otherwise reach
        # main and sit there until somebody ran the drill by hand.
        run: pnpm demo:phase7

      - name: Metrics recompute reproduces every rollup
        # The audit story for "₹ recovered", enforced rather than described.
        # The phase-6 demo has just folded a quarter of shop-days; re-folding
        # them from the event log must change nothing, and the command exits
        # non-zero if it does. A regression in the fold shows up here as a build
        # failure rather than as a number somebody queries a year later.
        run: pnpm metrics:recompute --from 2026-04-01 --to 2026-07-31

      - name: Install Playwright browsers
        run: pnpm --filter @serviceloop/console exec playwright install --with-deps chromium

      - name: Console end-to-end tests
        run: pnpm --filter @serviceloop/console run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/console/playwright-report/
          retention-days: 7
