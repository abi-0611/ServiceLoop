name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs entirely in DEMO_MODE against the sandbox adapters (master §5).
  DEMO_MODE: 'true'
  NODE_ENV: test
  CI: 'true'

jobs:
  static:
    name: lint · typecheck · unit tests · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Domain coverage gate (>= 80%)
        run: pnpm --filter @serviceloop/domain run test:coverage

      - name: Conversation simulator (scripted personas)
        # No database, no queue, no model: the persona suite is a pure CI
        # fixture, so it belongs in the fast job and gates every push.
        run: pnpm sim

      - name: Voice simulator (scripted calls)
        # Whole telephone calls, and the same rule applies: no database, no
        # telco, no model — a loopback line and fixture audio through the real
        # streaming speech port. A voice flow checked only by a person listening
        # to a demo regresses the first week nobody listens.
        run: pnpm sim:voice

      - name: Build
        run: pnpm build

  integration:
    name: integration · demos · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # `pnpm db:migrate` and `pnpm db:seed` call the db package directly
        # rather than through turbo, so nothing builds their @serviceloop/*
        # dependencies for them; those resolve to `dist/`, which must exist first.
        run: pnpm build

      - name: Start the dev stack
        # `up --wait` fails as soon as any container exits, even with status 0,
        # so the long-running services are waited on here and the one-shot bucket
        # bootstrap is run separately, where its exit code is the useful signal.
        run: |
          docker compose --project-directory . -f infra/compose.yaml up -d --wait postgres redis minio
          docker compose --project-directory . -f infra/compose.yaml run --rm minio-bootstrap

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      # Integration suites reuse the compose stack rather than starting their
      # own Testcontainers; the container path is exercised locally.
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://serviceloop:serviceloop@localhost:5432/serviceloop_test
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          docker compose --project-directory . -f infra/compose.yaml exec -T postgres \
            psql -U serviceloop -d postgres -c "CREATE DATABASE serviceloop_test"
          pnpm --filter @serviceloop/db run test:integration
          pnpm --filter @serviceloop/workers run test:integration
          pnpm --filter @serviceloop/api run test:integration

      - name: Phase 1 demo
        run: pnpm demo:phase1

      - name: Phase 2 demo
        run: pnpm demo:phase2

      - name: Phase 3 demo
        run: pnpm demo:phase3

      - name: Phase 4 demo
        run: pnpm demo:phase4

      - name: Phase 5 demo
        run: pnpm demo:phase5

      - name: Phase 6 demo
        run: pnpm demo:phase6

      - name: Metrics recompute reproduces every rollup
        # The audit story for "₹ recovered", enforced rather than described.
        # The phase-6 demo has just folded a quarter of shop-days; re-folding
        # them from the event log must change nothing, and the command exits
        # non-zero if it does. A regression in the fold shows up here as a build
        # failure rather than as a number somebody queries a year later.
        run: pnpm metrics:recompute --from 2026-04-01 --to 2026-07-31

      - name: Install Playwright browsers
        run: pnpm --filter @serviceloop/console exec playwright install --with-deps chromium

      - name: Console end-to-end tests
        run: pnpm --filter @serviceloop/console run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/console/playwright-report/
          retention-days: 7
