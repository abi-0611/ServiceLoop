# ServiceLoop development stack.
#
# Images are pinned by digest so a cold clone six months from now builds the
# same environment. Every service has a healthcheck; `pnpm dev` waits on them.
#
#   docker compose -f infra/compose.yaml up -d
#
name: serviceloop

services:
  postgres:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    container_name: serviceloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: serviceloop
      POSTGRES_PASSWORD: serviceloop
      POSTGRES_DB: serviceloop
      # Deterministic collation so ORDER BY matches between dev and prod.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-IN --encoding=UTF8'
    ports:
      # Host port is overridable: a developer machine often already runs a local
      # Postgres on 5432. Set POSTGRES_PORT in .env and point DATABASE_URL at it.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serviceloop -d serviceloop']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: serviceloop-redis
    restart: unless-stopped
    # BullMQ requires eviction to be disabled: a delayed escalation job must
    # never be evicted under memory pressure.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: serviceloop-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: serviceloop
      MINIO_ROOT_PASSWORD: serviceloop
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot bucket bootstrap. Exits 0 once `serviceloop-media` exists.
  # A container that exits fails `up --wait`, so CI waits on the three
  # long-running services and runs this one on its own.
  minio-bootstrap:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: serviceloop-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 serviceloop serviceloop &&
        mc mb --ignore-existing local/serviceloop-media &&
        mc anonymous set none local/serviceloop-media &&
        echo "bucket serviceloop-media ready"
    restart: 'no'

  # ------------------------------------------------------------------ #
  # Phase 7 — the observability and scanning stack.
  #
  # Every service below is in the `ops` profile, so `docker compose up -d`
  # still starts the four containers a developer needs and nothing more.
  # Grafana and Prometheus are for the day somebody is chasing a latency
  # problem, and paying two hundred megabytes of RAM for them on every
  # `pnpm dev` is how a developer learns to run the stack by hand instead.
  #
  #   docker compose --profile ops up -d
  # ------------------------------------------------------------------ #

  # NOTE ON PINNING: the four core services above are pinned by digest so a
  # cold clone builds an identical environment. These four are pinned by tag
  # only, and that is a deliberate, narrower promise rather than an oversight —
  # they are development-time observability, never part of a deployed artefact,
  # and a digest nobody has verified is worse than an honest tag. Before these
  # are relied on in a shared environment, run `docker compose --profile ops
  # pull` and paste the resolved digests in, as `docs/runbooks/observability.md`
  # instructs.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: serviceloop-prometheus
    profiles: ['ops']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      # Needed for the reliability drills: an alert rule is fired by injecting a
      # condition and then reloaded rather than by restarting the container.
      - '--web.enable-lifecycle'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # The API and the workers run on the host under `pnpm dev`, not in
      # compose. Without this the scrape targets resolve to the container.
      - 'host.docker.internal:host-gateway'

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: serviceloop-alertmanager
    profiles: ['ops']
    restart: unless-stopped
    ports:
      - '${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.5.1
    container_name: serviceloop-grafana
    profiles: ['ops']
    restart: unless-stopped
    environment:
      # Dev-stack only. The dashboards carry no customer data — see the
      # metrics module's label policy — but the anonymous-admin setting is
      # the sort of thing that gets copied into a prod compose file, so it is
      # scoped to a profile that production never runs.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: light
    ports:
      - '${GRAFANA_PORT:-3002}:3000'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Upload scanning (phase 7.1). In the `ops` profile because a developer
  # sending fixture photographs does not need it, and it pulls a 250 MB
  # signature database on first start.
  clamav:
    image: clamav/clamav:1.4
    container_name: serviceloop-clamav
    profiles: ['ops']
    restart: unless-stopped
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    healthcheck:
      # `clamdcheck` returns non-zero until the signature database has loaded,
      # which takes a minute or two on a cold start. Anything that scans before
      # then gets UNAVAILABLE, which is exactly what fail-open is for.
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
