# Cloud Build: three images from two Dockerfiles (phase 7.7).
#
# The two Node images build in parallel from the same multi-target Dockerfile,
# and Cloud Build caches the shared `deps` and `build` stages between them — so
# the second one costs a copy rather than a second `pnpm install`.

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=infra/docker/Dockerfile.node
      - --target=api
      - --tag=${_IMAGE_BASE}/api:${_TAG}
      # `--cache-from` on the previous build's image turns a five-minute
      # install into a layer hit. Without it every deploy re-resolves the
      # entire lockfile.
      - --cache-from=${_IMAGE_BASE}/api:latest
      - .

  - id: workers
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=infra/docker/Dockerfile.node
      - --target=workers
      - --tag=${_IMAGE_BASE}/workers:${_TAG}
      - --cache-from=${_IMAGE_BASE}/workers:latest
      - .

  - id: console
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=infra/docker/Dockerfile.console
      - --tag=${_IMAGE_BASE}/console:${_TAG}
      - --cache-from=${_IMAGE_BASE}/console:latest
      - .

  # `latest` is pushed *only* so the next build can use it as a cache source.
  # Nothing is ever deployed from `latest`: every Cloud Run revision names an
  # immutable `${_TAG}`, so a rollback is a revision id and not a hope about
  # what a moving tag pointed at last Tuesday.
  - id: tag-latest
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        for image in api workers console; do
          docker tag "${_IMAGE_BASE}/$$image:${_TAG}" "${_IMAGE_BASE}/$$image:latest"
        done

images:
  - ${_IMAGE_BASE}/api:${_TAG}
  - ${_IMAGE_BASE}/workers:${_TAG}
  - ${_IMAGE_BASE}/console:${_TAG}
  - ${_IMAGE_BASE}/api:latest
  - ${_IMAGE_BASE}/workers:latest
  - ${_IMAGE_BASE}/console:latest

substitutions:
  _TAG: dev
  _IMAGE_BASE: unset
